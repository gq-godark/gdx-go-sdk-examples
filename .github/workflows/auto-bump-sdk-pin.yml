name: Auto-bump SDK pin

# Listener: triggered by gdx-go-sdk notify-examples.yml (repository_dispatch)
# or manually. Clones gdx-go-sdk at the dispatched SHA, runs
# scripts/refresh_sdk.sh, opens a rolling PR if any drift. No protoc /
# protoc-gen-go required -- upstream commits its pre-generated proto
# bindings, so the refresh is a pure rsync.

on:
  repository_dispatch:
    types: [gdx-sdk-changed]
  workflow_dispatch:
    inputs:
      sdk_sha:
        description: gdx-go-sdk commit SHA to vendor (for manual testing)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump:
    name: Refresh sdk/ + open PR if changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          repositories: gdx-go-sdk-examples,gdx-go-sdk

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve SDK SHA
        id: sha
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sdk_sha }}
          INPUT_SHA: ${{ inputs.sdk_sha }}
        run: |
          SHA="${DISPATCH_SHA:-$INPUT_SHA}"
          if [ -z "$SHA" ]; then
            echo "::error::No sdk_sha in dispatch payload and no workflow_dispatch input."
            exit 1
          fi
          echo "sdk_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Vendoring gdx-go-sdk@${SHA}"

      - name: Clone gdx-go-sdk at SHA
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SDK_SHA: ${{ steps.sha.outputs.sdk_sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/gq-godark/gdx-go-sdk.git" /tmp/gdx-go-sdk
          git -C /tmp/gdx-go-sdk checkout "$SDK_SHA"

      - name: Refresh vendored sdk/
        run: bash scripts/refresh_sdk.sh /tmp/gdx-go-sdk

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- sdk/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No changes after refresh."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- sdk/
          fi

      - name: Configure git + open rolling PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto/bump-sdk-pin
          SDK_SHA: ${{ steps.sha.outputs.sdk_sha }}
        run: |
          set -euo pipefail
          git config user.name "gdx-app[bot]"
          git config user.email "gdx-app[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add sdk/
          git commit -m "chore(sdk): vendor godark sources from gdx-go-sdk@${SDK_SHA}

          Auto-generated by .github/workflows/auto-bump-sdk-pin.yml in
          response to a gdx-sdk-changed dispatch event. Refreshes the
          vendored sdk/ tree (Go sources + pre-generated protobuf
          bindings under sdk/proto/) and bumps sdk/UPSTREAM_REF to the
          new upstream commit.

          Review notes:
          - The sdk/ diff is mechanical (rsync of upstream).
          - Wire-format changes under sdk/proto/ should be cross-
            checked against the gdx-proto SHA the upstream SDK is pinned
            to; if new wire features landed, hand-written wrappers in
            sdk/proto.go / client.go / types.go may need follow-up
            changes -- this workflow only refreshes the wire layer."
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Existing PR force-pushed; no new PR opened."
            gh pr view "$BRANCH" --json url --jq .url
          else
            gh pr create \
              --title "auto: bump vendored SDK to ${SDK_SHA:0:7}" \
              --body "Vendors \`sdk/\` from \`gq-godark/gdx-go-sdk@${SDK_SHA}\` and bumps \`sdk/UPSTREAM_REF\` to match.

          - **Source repo**: \`gq-godark/gdx-go-sdk\`
          - **Source SHA**: \`${SDK_SHA}\`
          - **Workflow**: [.github/workflows/auto-bump-sdk-pin.yml](https://github.com/gq-godark/gdx-go-sdk-examples/blob/main/.github/workflows/auto-bump-sdk-pin.yml)

          ### Review checklist
          - [ ] Inspect the descriptor diff under \`sdk/proto/**\` for any field rename / removal that affects hand-written wrappers in \`sdk/proto.go\` / \`client.go\` / \`types.go\`.
          - [ ] If new wire features were added (new enums, new oneof variants, new message types), open a follow-up PR to surface them in the public Go API. This workflow only refreshes the wire layer.
          - [ ] Confirm CI is green (\`release.yml\` parity check should pass since sdk/ now matches the new pin).

          Merge to \`main\` to cut a new GitHub Release zip via \`release.yml\`." \
              --base main \
              --head "$BRANCH" \
              --label automation \
              --label sdk-bump
          fi
