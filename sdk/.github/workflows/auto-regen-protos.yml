name: Auto-regen protos from gdx-proto

# Layer 1 listener in the auto-publish chain.
# Triggered by gdx-proto's notify-sdk.yml dispatcher (or manually via
# workflow_dispatch). Runs the same proto_gen.sh + git diff that the
# proto_drift CI job uses, and if anything changed:
#
#   1. bumps the gdx-proto submodule pin to the new upstream HEAD
#   2. regenerates proto/gdx/**/*.pb.go
#   3. force-pushes a single rolling branch `auto/regen-protos` and opens
#      a PR against `main` if one isn't already open; otherwise the
#      existing open PR updates in place (HEAD moves, no new PR is
#      created).
#
# Idempotent: re-runs against the same upstream SHA produce no diff and
# exit clean. Each new upstream SHA replaces the rolling branch's tip via
# force-push.

on:
  repository_dispatch:
    types: [gdx-proto-changed]
  workflow_dispatch:
    inputs:
      proto_branch:
        description: gdx-proto branch to regen against (defaults to dev)
        required: false
        default: dev

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate bindings + open PR if drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          repositories: gdx-go-sdk,gdx-proto

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve target proto branch
        id: branch
        env:
          DISPATCH_BRANCH: ${{ github.event.client_payload.proto_branch }}
          INPUT_BRANCH: ${{ inputs.proto_branch }}
        run: |
          BR="${DISPATCH_BRANCH:-${INPUT_BRANCH:-dev}}"
          echo "ref=${BR}" >> "$GITHUB_OUTPUT"
          echo "Regenerating against gdx-proto@${BR}"

      - name: Drop submodule placeholder so we can lay down a fresh gdx-proto checkout
        run: rm -rf gdx-proto

      - uses: actions/checkout@v5
        with:
          repository: gq-godark/gdx-proto
          ref: ${{ steps.branch.outputs.ref }}
          path: gdx-proto
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate bindings
        run: bash scripts/proto_gen.sh

      - name: Detect drift (bindings or submodule pin)
        id: drift
        run: |
          if git diff --quiet -- proto gdx-proto; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No bindings or submodule drift; nothing to do."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected:"
            git diff --stat -- proto gdx-proto
          fi

      - name: Read upstream SHA
        if: steps.drift.outputs.drift == 'true'
        id: sha
        run: |
          cd gdx-proto
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.drift.outputs.drift == 'true'
        run: |
          git config user.name "gdx-app[bot]"
          git config user.email "gdx-app[bot]@users.noreply.github.com"

      - name: Open or refresh rolling PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto/regen-protos
          PROTO_REF: ${{ steps.branch.outputs.ref }}
          PROTO_SHORT: ${{ steps.sha.outputs.short }}
          PROTO_FULL: ${{ steps.sha.outputs.full }}
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH"
          git add proto gdx-proto
          git commit -m "chore(proto): regen bindings from gdx-proto@${PROTO_SHORT} (${PROTO_REF})

          Auto-generated by .github/workflows/auto-regen-protos.yml in
          response to a gdx-proto-changed dispatch event. Bumps the
          gdx-proto submodule pin to ${PROTO_FULL} and regenerates
          proto/gdx/**/*.pb.go to match.

          Review notes:
          - The bindings change is mechanical (descriptors only).
          - If the upstream commit added/removed wire fields, hand-written
            wrappers in proto.go / client.go / types.go may need follow-up
            changes; that work is intentionally NOT done by this workflow."
          git push --force origin "$BRANCH"

          # Only treat an OPEN PR as "existing". gh pr view matches closed /
          # merged PRs too, which previously caused silent no-ops after a
          # rolling PR was closed (e.g. Go #7, Java #2) — the branch was
          # force-pushed but no new PR was opened.
          OPEN_PR="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            echo "Existing open PR #${OPEN_PR} force-pushed; no new PR opened."
            gh pr view "$OPEN_PR" --json url --jq .url
          else
            gh pr create \
              --title "auto: regen protos from gdx-proto@${PROTO_SHORT} (${PROTO_REF})" \
              --body "Triggered by \`gdx-proto@${PROTO_FULL}\` on branch \`${PROTO_REF}\`.

          Bumps the \`gdx-proto\` submodule pin and regenerates \`proto/gdx/**/*.pb.go\` to match.

          - **Source repo**: \`gq-godark/gdx-proto\`
          - **Source branch**: \`${PROTO_REF}\`
          - **Source SHA**: \`${PROTO_FULL}\`
          - **Workflow**: [.github/workflows/auto-regen-protos.yml](https://github.com/gq-godark/gdx-go-sdk/blob/main/.github/workflows/auto-regen-protos.yml)

          ### Review checklist
          - [ ] Inspect the descriptor diff under \`proto/**/*.pb.go\` for any field rename / removal that affects hand-written wrappers in \`proto.go\` / \`client.go\` / \`types.go\`.
          - [ ] If new wire features were added (new enums, new oneof variants, new message types), open a follow-up PR to surface them in the public Go API. This workflow only refreshes the wire layer.
          - [ ] Confirm CI is green (\`build\`, \`proto_drift\` should all pass since they now check against the same upstream ref)." \
              --base main \
              --head "$BRANCH" \
              --label automation \
              --label proto-regen
          fi
